<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>Arnfar news video</title>
<style>
@font-face{font-family:"ArnLatin";src:url("fonts/NotoLatin-Regular.ttf") format("truetype");}
@font-face{font-family:"ArnLao";src:url("fonts/Phetsarath-Regular.ttf") format("truetype");}
@font-face{font-family:"ArnBlackLat";src:url("fonts/NotoSans-Black.woff2") format("woff2");}
@font-face{font-family:"ArnBlackLao";src:url("fonts/NotoSansLao-Black.woff2") format("woff2");}
html,body{margin:0;padding:0;background:#050c1d}
*{box-sizing:border-box}
#stage{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:ArnLatin,ArnLao,sans-serif;color:#fff;
  background:radial-gradient(900px 900px at 0% 0%,rgba(3,148,241,.35),transparent 60%),radial-gradient(900px 900px at 100% 100%,rgba(21,198,122,.30),transparent 60%),#050c1d}
#bgimg{position:absolute;left:-110px;top:-190px;width:1300px;height:2300px;background-size:cover;background-position:center;opacity:.95;will-change:transform}
#bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,29,.35),rgba(5,12,29,.05) 35%,rgba(5,12,29,.15) 65%,rgba(5,12,29,.55))}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 20px 60px rgba(0,0,0,.35)}
.grad{background:linear-gradient(90deg,#0394F1,#15C67A);-webkit-background-clip:text;background-clip:text;color:transparent}
.abs{position:absolute}
.prog{left:60px;right:150px;top:1486px;height:6px;display:grid;gap:8px}
.seg{background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.seg i{display:block;height:100%;background:linear-gradient(90deg,#0394F1,#15C67A)}
.top{left:60px;right:60px;top:170px;display:flex;justify-content:space-between;align-items:center}
.tag{padding:14px 30px;border-radius:999px;font-size:32px;background:linear-gradient(90deg,#0394F1,#15C67A)}
.tag.warn{background:linear-gradient(90deg,#d8342c,#f29a1a)}
.badge{display:flex;align-items:center;gap:14px;padding:10px 28px 10px 12px;border-radius:999px}
.badge img{width:60px;height:60px;border-radius:50%;background:#fff}
.badge div{font-size:40px}
.scene{position:absolute;inset:0}
.frame{border-radius:36px;padding:16px;overflow:hidden}
.frame .clip{width:100%;height:100%;border-radius:24px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;transform-origin:50% 30%}
.credit{left:90px;right:150px;font-size:22px;color:#b9cbe0;text-align:center}
.sub{left:60px;right:150px;bottom:450px;min-height:160px;border-radius:30px;padding:26px 34px;font-size:44px;line-height:1.55;text-align:center;display:flex;align-items:center;justify-content:center}
.sub .hl{color:#3ee09a}
.chip{display:flex;flex-direction:column;gap:4px;padding:22px 30px;border-radius:26px;flex:1 1 300px}
.chip .k{font-size:26px;color:#b9cbe0}
.chip .v{font-size:50px}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 32px;border-radius:28px}
.row .a{font-size:52px}
.row .b{font-size:28px;color:#3ee09a}
.row.bad{border:2px dashed rgba(255,138,112,.7);background:none;box-shadow:none;backdrop-filter:none}
.row.bad .a,.row.bad .b{color:#ff8a70}
.warnc{color:#ff8a70}
.top,.prog,.erp,.sub,.follow{z-index:5}
#phlayer{position:absolute;inset:0;overflow:hidden}
.ph{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:opacity}
.ph .fill{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(36px) brightness(.55) saturate(1.2)}
.ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;will-change:transform}
.ph.fit img{object-fit:contain;top:560px;height:620px}
#phshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,12,29,.62) 0%,rgba(5,12,29,.08) 20%,rgba(5,12,29,0) 62%,rgba(5,12,29,.4) 76%,rgba(5,12,29,.82) 88%,rgba(5,12,29,.95) 100%)}
.phcredit{position:absolute;left:90px;right:150px;top:1196px;font-size:22px;color:#c9d6e6;text-shadow:0 2px 8px rgba(0,0,0,.8);z-index:4}
.dim{position:absolute;inset:0;background:rgba(5,12,29,.5)}
.chap{left:90px;top:392px;padding:10px 24px;border-radius:999px;font-size:30px;background:rgba(5,12,29,.6);border:1px solid rgba(255,255,255,.28)}
.gradw{background:linear-gradient(90deg,#ffd23a,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent}
.chap b{font-weight:normal;color:#3ee09a}
.follow{right:60px;top:270px;display:flex;align-items:center;gap:12px;padding:10px 26px 10px 12px;border-radius:999px;font-size:30px;background:linear-gradient(90deg,#0394F1,#15C67A);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.follow img{width:46px;height:46px;border-radius:50%;background:#fff}
.hookfull{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;padding:0!important;border-radius:0!important}
.hookfull img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform-origin:50% 50%}
.hookfull::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,29,.55) 0%,rgba(5,12,29,.05) 22%,rgba(5,12,29,.25) 44%,rgba(5,12,29,.7) 62%,rgba(5,12,29,.95) 80%,rgba(5,12,29,.98) 100%)}
.erp{left:60px;right:150px;top:1500px;height:84px;border-radius:24px;padding:0 22px;display:flex;gap:16px;align-items:center}
.erp img{width:56px;height:56px;border-radius:50%;background:#fff;flex:none}
.erp .l1{font-size:26px;white-space:nowrap}
.erp .l2{font-size:20px;color:#b9cbe0;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><div id="bgimg"></div><div id="phlayer"></div><div id="phshade"></div><div id="root"></div></div>
<script>
// Deterministic renderer: everything is a pure function of time t (seconds).
// window.SPEC is injected before load; window.seek(t) paints frame t.
const S = window.SPEC;
const root = document.getElementById('root');
const el = (tag, cls, html, style) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; return e; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl = (text, h) => { const t = esc(text); if (!h) return t; const hs = Array.isArray(h) ? h : [h]; let out = t; for (const x of hs) { const ex = esc(x); const i = out.indexOf(ex); if (i >= 0) out = out.slice(0,i) + '<span class="hl">' + ex + '</span>' + out.slice(i+ex.length); } return out; };
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };

const FP = !!S.fullphoto;
if (S.background && !FP) document.getElementById('bgimg').style.backgroundImage = `url("${S.background}")`;
// full-screen photo timeline: every line can switch the background photo (line.photo), else its scene photo
const phSegs = [];
if (FP) {
  const lineScene = []; S.scenes.forEach(sc => sc.lines.forEach(i => { lineScene[i] = sc; }));
  S.lines.forEach((ln, i) => {
    const sc = lineScene[i] || {};
    const src = ln.photo || sc.photo || (phSegs.length ? phSegs[phSegs.length-1].src : null);
    if (!src) return;
    const credit = ln.photo ? (ln.credit || '') : (sc.credit || (phSegs.length ? phSegs[phSegs.length-1].credit : ''));
    const focus = ln.photo ? (ln.focus || '50% 50%') : (sc.focus || '50% 50%');
    const fit = ln.photo ? ln.fit : sc.fit;
    const start = i === 0 ? 0 : ln.start;
    if (phSegs.length && phSegs[phSegs.length-1].src === src) return;
    phSegs.push({src, credit, focus, fit, start});
  });
  const layer = document.getElementById('phlayer');
  phSegs.forEach((sg, k) => {
    const d = el('div', 'ph' + (sg.fit === 'contain' ? ' fit' : ''), `<div class="fill"></div><img alt="">`);
    d.querySelector('.fill').style.backgroundImage = `url("${sg.src}")`;
    const im = d.querySelector('img'); im.src = sg.src; im.style.objectPosition = sg.focus;
    layer.appendChild(d); sg.el = d; sg.img = im; sg.dir = k % 2 ? -1 : 1;
  });
  phSegs.forEach((sg, k) => { sg.end = k < phSegs.length - 1 ? phSegs[k+1].start : S.duration; });
} else {
  document.getElementById('phshade').style.display = 'none';
}
const phCredit = el('div', 'phcredit', ''); if (FP) document.getElementById('stage').appendChild(phCredit);

// persistent chrome
const n = S.scenes.length;
const prog = el('div','abs prog'); prog.style.gridTemplateColumns = `repeat(${n}, minmax(0,1fr))`;
const segs = S.scenes.map(() => { const s = el('div','seg'); const i = el('i'); s.appendChild(i); prog.appendChild(s); return i; });
root.appendChild(prog);
const topBar = el('div','abs top');
const tag = el('div','tag' + (S.accent === 'warn' ? ' warn' : ''), esc(S.tag));
const badge = el('div','glass badge', `<img src="${S.logo}" alt=""><div>Arnfar</div>`);
topBar.append(tag, badge); root.appendChild(topBar);

// scenes
function buildScene(sc) {
  const w = el('div','scene'); const parts = [];
  if (FP && ['stat','list','question'].includes(sc.type)) w.appendChild(el('div','dim'));
  const add = (node, delay=0) => { w.appendChild(node); parts.push({node, delay}); return node; };
  if (sc.type === 'hook' && sc.full) {
    // cover-style first frame: full-bleed photo + big headline, so frame 0 already tells the story
    const f = el('div','hookfull frame','<img>'); f.querySelector('img').src = sc.photo; if (sc.focus) f.querySelector('img').style.objectPosition = sc.focus; w.appendChild(f);
    const h = el('div','abs', '', 'left:80px;right:150px;top:800px;display:flex;flex-direction:column;gap:4px');
    (sc.title || []).forEach((ln, i, a) => { const d = el('div', i === a.length-1 && a.length > 1 ? (S.accent === 'warn' ? 'gradw' : 'grad') : '', esc(ln), `font-family:ArnBlackLat,ArnBlackLao,ArnLao,sans-serif;font-size:${sc.title_size||104}px;line-height:1.3;white-space:nowrap;text-shadow:0 6px 30px rgba(0,0,0,.6)`); d.dataset.fit = 1; h.appendChild(d); });
    add(h, 0);
    if (sc.big) add(el('div','abs glass', `<div class="${S.accent === 'warn' ? 'gradw' : 'grad'}" style="font-family:ArnBlackLat,ArnLatin,sans-serif;font-size:120px;line-height:1">${esc(sc.big)}</div>${sc.big_label ? `<div style="font-size:30px;color:#e6eef8;margin-top:8px">${esc(sc.big_label)}</div>` : ''}`, 'right:150px;top:500px;padding:22px 32px;border-radius:30px;text-align:center;transform:rotate(-4deg);background:rgba(5,12,29,.72);border:2px solid rgba(255,255,255,.8)'), 0);
    if (sc.credit) add(el('div','abs credit', esc(sc.credit), 'top:1060px;text-align:left'), .25);
  } else if (sc.type === 'hook') {
    const h = el('div','abs', '', 'left:90px;right:150px;top:470px;display:flex;flex-direction:column;gap:10px');
    (sc.title || []).forEach((ln, i, a) => { const d = el('div', i === a.length-1 && a.length > 1 ? 'grad' : '', esc(ln), `font-size:${sc.title_size||86}px;line-height:1.4;white-space:nowrap`); d.dataset.fit = 1; h.appendChild(d); });
    add(h, 0);
    const f = el('div','abs glass frame','<div class="clip"><img></div>','left:70px;right:130px;top:660px;height:390px'); f.querySelector('img').src = sc.photo; add(f, .15);
    if (sc.credit) add(el('div','abs credit', esc(sc.credit), 'top:1062px'), .25);
  } else if (sc.type === 'photo' && FP) {
    // full-screen mode: the photo itself is the background layer; only fact chips sit on top
    const c = el('div','abs','', 'left:90px;right:150px;top:470px;display:flex;flex-wrap:wrap;gap:18px');
    (sc.chips || []).forEach((ch) => { const d = el('div','glass chip', `<div class="k">${esc(ch.k)}</div><div class="v ${ch.warn ? 'warnc' : 'grad'}">${esc(ch.v)}</div>`); d.style.background = 'rgba(5,12,29,.55)'; d.style.padding = '18px 26px'; d.querySelector('.v').style.fontSize = '40px'; c.appendChild(d); });
    add(c, .2);
  } else if (sc.type === 'photo') {
    const f = el('div','abs glass frame','<div class="clip"><img></div>','left:70px;right:130px;top:470px;height:470px'); f.querySelector('img').src = sc.photo;
    if (sc.focus) f.querySelector('img').style.objectPosition = sc.focus;
    add(f, 0);
    if (sc.credit) add(el('div','abs credit', esc(sc.credit), 'top:868px'), .1);
    const c = el('div','abs','', 'left:90px;right:150px;top:910px;display:flex;flex-wrap:wrap;gap:18px');
    (sc.chips || []).forEach((ch, i) => { const d = el('div','glass chip', `<div class="k">${esc(ch.k)}</div><div class="v ${ch.warn ? 'warnc' : 'grad'}">${esc(ch.v)}</div>`); c.appendChild(d); });
    add(c, .2);
  } else if (sc.type === 'stat') {
    const box = el('div','abs glass','', 'left:90px;right:150px;top:470px;height:660px;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px');
    box.innerHTML = `<div style="font-size:38px;color:#b9cbe0;text-align:center">${esc(sc.label)}</div>
      <div style="display:flex;align-items:baseline;gap:12px"><div class="grad num" data-fit="1" style="font-size:${sc.value_size||300}px;line-height:1.1;white-space:nowrap;max-width:820px">${esc(sc.value)}</div>${sc.unit ? `<div style="font-size:96px;color:#b9cbe0">${esc(sc.unit)}</div>` : ''}</div>
      ${sc.bar != null ? `<div style="width:640px;height:18px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden"><div class="bar" style="width:0;height:100%;border-radius:9px;background:${sc.bar_warn ? 'linear-gradient(90deg,#f29a1a,#d8342c)' : 'linear-gradient(90deg,#0394F1,#15C67A)'}"></div></div>` : ''}
      ${sc.note ? `<div style="font-size:34px;margin-top:18px" class="${sc.bar_warn ? 'warnc' : ''}">${esc(sc.note)}</div>` : ''}
      ${sc.source ? `<div style="font-size:24px;color:#9fb3c9;margin-top:8px">${esc(sc.source)}</div>` : ''}`;
    add(box, 0); w._stat = sc;
  } else if (sc.type === 'list') {
    add(el('div','abs', `${esc(sc.heading||'')}${sc.heading_hl ? `<span class="grad">${esc(sc.heading_hl)}</span>` : ''}`, 'left:90px;right:150px;top:470px;font-size:60px;line-height:1.35'), 0);
    const l = el('div','abs','', 'left:90px;right:150px;top:590px;display:flex;flex-direction:column;gap:16px');
    w.appendChild(l);
    (sc.items || []).forEach((it, i) => { const r = el('div', 'glass row' + (it.bad ? ' bad' : ''), `<div class="a">${esc(it.a)}</div>${it.b ? `<div class="b">${esc(it.b)}</div>` : ''}`); l.appendChild(r); parts.push({node: r, delay: .12 + i * .18}); });
  } else if (sc.type === 'question') {
    if (sc.points && sc.points.length) {
      const b = el('div','abs glass','', 'left:90px;right:150px;top:470px;border-radius:36px;padding:32px 40px;display:flex;flex-direction:column;gap:18px');
      b.innerHTML = `<div style="font-size:32px;color:#b9cbe0">${esc(sc.kicker||'')}</div><div style="display:flex;flex-direction:column;gap:18px;font-size:46px;line-height:1.45">${sc.points.map((p,i)=>`<div style="display:flex;gap:20px;align-items:flex-start"><div class="grad" style="min-width:50px">${i+1}.</div><div>${esc(p)}</div></div>`).join('')}</div>`;
      add(b, 0);
    }
    const q = el('div','abs','', `left:90px;right:150px;top:${sc.points && sc.points.length ? 850 : 560}px;border-radius:36px;padding:3px;background:linear-gradient(90deg,#0394F1,#15C67A)`);
    q.innerHTML = `<div style="border-radius:33px;background:#0a1730;padding:36px 40px;display:flex;gap:28px;align-items:center"><svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#3ee09a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h7"/><path d="M8.5 14h4.5"/></svg><div style="font-size:50px;line-height:1.45">${esc(sc.question)}</div></div>`;
    add(q, .25);
  } else if (sc.type === 'outro') {
    const c = el('div','abs','', 'left:90px;right:150px;top:390px;display:flex;flex-direction:column;align-items:center;gap:22px');
    c.innerHTML = `<div class="logo" style="width:210px;height:210px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(3,148,241,.18),0 0 100px rgba(21,198,122,.35)"><img src="${S.logo}" style="width:190px;height:190px"></div>
      <div style="font-size:84px;line-height:1.1">Arnfar</div>
      <div style="font-size:40px;color:#b9cbe0;text-align:center;line-height:1.5">ຂ່າວເຕັກ ແລະ AI ສະຫຼຸບເປັນພາສາລາວ</div>
      <div style="display:flex;gap:20px;margin-top:20px"><div class="cta" style="padding:24px 48px;border-radius:999px;background:linear-gradient(90deg,#0394F1,#15C67A);font-size:44px">ກົດຕິດຕາມ</div><div class="glass" style="padding:24px 48px;border-radius:999px;font-size:44px">ແບ່ງປັນ</div></div>`;
    add(c, 0);
    const ad = el('div','abs glass','', 'left:90px;right:150px;top:1080px;border-radius:30px;padding:20px 24px;display:flex;gap:20px;align-items:center');
    ad.innerHTML = `<img src="${S.logo}" style="width:76px;height:76px;border-radius:50%;background:#fff"><div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:30px"><span class="grad">Arnfar</span> ERP · ບັນຊີ · ສາງສິນຄ້າ · HR · Payroll</div><div style="font-size:24px;color:#b9cbe0">arnfar.com · ໂທ 020 9999 6967</div></div>`;
    add(ad, .3); w._outro = c;
  }
  if (sc.chapter) { const c = el('div','abs chap', esc(sc.chapter).replace(/^(\S+)/, '<b>$1</b>')); add(c, .1); }
  w._parts = parts; w.style.opacity = 0; root.appendChild(w); return w;
}
const scenes = S.scenes.map(buildScene);
const sub = el('div','abs glass sub'); const subIn = el('div'); sub.appendChild(subIn); root.appendChild(sub);
// persistent Arnfar ERP footer (hidden during the outro, which has its own big ERP band)
const erp = el('div','abs glass erp', `<img src="${S.logo}" alt=""><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><div class="l1"><span class="grad">Arnfar</span> ERP · ບັນຊີ · ສາງສິນຄ້າ · HR · Payroll</div><div class="l2">ເຊື່ອມທຸກລະບົບເປັນບັນຊີດຽວ · arnfar.com · ໂທ 020 9999 6967</div></div>`);
root.appendChild(erp);
const outroIdx = S.scenes.findIndex(sc => sc.type === 'outro');
// mid-video follow reminder (replaces a long spoken promo); off with "follow_at": null
const followAt = S.follow_at === null ? null : (S.follow_at != null ? S.follow_at : 0.42);
const follow = el('div','abs follow', `<img src="${S.logo}" alt=""><div>${esc(S.follow_text || 'ກົດຕິດຕາມ Arnfar')}</div>`); follow.style.opacity = 0; root.appendChild(follow);
// line start times, for a short punch-in on every new line (visual change every few seconds)
const lineStarts = S.lines.map(l => l.start);
const punch = t => { let last = -99; for (const s of lineStarts) { if (s <= t) last = s; else break; } const d = t - last; return d >= 0 && d < .45 ? 0.045 * (1 - ease(d / .45)) : 0; };

// timing helpers
const lineAt = t => { let k = -1; S.lines.forEach((ln, i) => { if (t >= ln.start - 0.05) k = i; }); return k; };
const sceneSpan = i => { const sc = S.scenes[i]; const a = S.lines[sc.lines[0]].start; const lastLine = sc.lines[sc.lines.length-1]; const b = i < n-1 ? S.lines[S.scenes[i+1].lines[0]].start : S.duration; return [i === 0 ? 0 : a, b]; };
const spans = S.scenes.map((_, i) => sceneSpan(i));
let lastSub = -2;

const bgEl = document.getElementById('bgimg');
window.seek = function (t) {
  // slow background drift (Ken Burns), deterministic in t
  if (S.background) { const p = t / Math.max(S.duration, 1); bgEl.style.transform = `translate(${Math.sin(p * Math.PI) * 60 - 30}px, ${-p * 120 + 60}px) scale(${1 + 0.05 * p})`; }
  // progress bar
  spans.forEach(([a, b], i) => { segs[i].style.width = (clamp((t - a) / (b - a)) * 100) + '%'; });
  // scenes: cross-fade 0.35 s
  scenes.forEach((w, i) => {
    const [a, b] = spans[i]; const fin = i === 0 ? 1 : ease((t - a) / .35); const fout = i === n-1 ? 1 : 1 - clamp((t - (b - .2)) / .25);
    const vis = t >= a - .01 && t < b + .06; const op = vis ? Math.min(fin, fout) : 0;
    w.style.opacity = op; w.style.visibility = op > 0 ? 'visible' : 'hidden';
    if (!vis) return;
    const lt = t - a;
